onboarding = false

[experimental]
switch_ascii_input_source_in_prefix = true

[keys]
prefix = "ctrl + enter"

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false
pane_scrollbars = false
pane_gaps = false
show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
rows = [["workspace"]]

[ui.sidebar.agents]
rows = [
  [
    "workspace",
    "tab",
  ],
  [
    "state_icon",
    "machine",
    "agent",
    "state_text",
  ],
  [
    "terminal_title_stripped",
  ],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [
    "workspace",
    "tab",
  ],
  [
    "state_icon",
    "machine",
    { token = "agent", fg = "#d97757" },
    "state_text",
  ],
  [
    "terminal_title_stripped",
  ],
]
codex = [
  [
    "workspace",
    "tab",
  ],
  [
    "state_icon",
    "machine",
    { token = "agent", fg = "#4b56f5" },
    "state_text",
  ],
  [
    "terminal_title_stripped",
  ],
]
pi = [
  [
    "workspace",
    "tab",
  ],
  [
    "state_icon",
    "machine",
    { token = "agent", fg = "#5e93b6" },
    "state_text",
  ],
  [
    "terminal_title_stripped",
  ],
]

[theme]
name = "dracula"
